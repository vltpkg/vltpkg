name: Perry

# The vlt → Perry native-binary port.
#
#   gate-g0     the pinned toolchain compiles + runs a hello-world
#   codegen     generated files are current, and no new `import()` appears
#   gate-g2     patches reapply after a fresh install
#   dark-tests  the five compiled-vs-Node subsystem suites
#
# Phase 6 adds the per-PR `perry check` gate over the workspaces and the
# compiled smoke job.

on:
  push:
    branches:
      - main
    paths: &perry-paths
      - 'perry.toml'
      - 'perry-toolchain.json'
      - 'perry-patches/**'
      - 'scripts/perry/**'
      - 'src/**'
      - '.github/workflows/perry.yml'
  pull_request:
    paths: *perry-paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate-g0:
    name: Gate G0 (compile hello-world)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read Perry Pin
        id: pin
        run: echo "version=$(jq -r .version perry-toolchain.json)" >> "$GITHUB_OUTPUT"

      # Extracted toolchain is ~1.7GB (525MB download). Cache hit skips both.
      # Revisit if save/restore costs more than the download (G6 measures CI wall-time).
      - name: Cache Perry Toolchain
        uses: actions/cache@v4
        with:
          path: ~/.cache/vltpkg-perry
          key: perry-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.version }}

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Install Perry
        run: ./scripts/perry/setup-toolchain.sh

      # Diagnostics only — gate-g0.sh is the assertion.
      - name: Perry Doctor
        continue-on-error: true
        run: |
          PERRY_DIR="$(./scripts/perry/setup-toolchain.sh)"
          "$PERRY_DIR/perry" doctor

      - name: Gate G0
        run: ./scripts/perry/gate-g0.sh

  # Cheap, no toolchain: everything that is a pure source-shape assertion.
  codegen:
    name: Codegen + F4 gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '^22.22.0'
          check-latest: true

      # Regenerating must be a no-op. A new command or a version bump
      # that is not reflected here fails the build.
      - name: Generated files are current
        run: |
          node scripts/perry/gen/commands-map.mjs --check
          node scripts/perry/gen/version-modules.mjs --check
          node scripts/perry/gen/daemon-modules.mjs --check
          node scripts/perry/gen/prompt-modules.mjs --check

      # `import()` below module top level compiles clean and throws at
      # runtime. This is the only gate that catches it.
      - name: No unowned dynamic imports
        run: node scripts/perry/scan-dynamic-imports.mjs

  gate-g2:
    name: Gate G2 (patch reapply)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '^22.22.0'
          check-latest: true

      - name: Setup vlt
        uses: vltpkg/setup-vlt@v1

      # Fresh install, then reapply: this is the half of G2 that proves the
      # patch ledger survives an install rewriting node_modules.
      - name: Install Dependencies
        run: vlt install

      - name: Patches are not applied on a fresh install
        run: |
          if ./scripts/perry/apply-patches.sh --check; then
            echo "patches survived a fresh install - the ledger is not proving anything" >&2
            exit 1
          fi

      - name: Apply patches
        run: ./scripts/perry/apply-patches.sh

      - name: Patches verify
        run: ./scripts/perry/apply-patches.sh --check

      # Lives here, not in the codegen job: regenerating needs an
      # installed node_modules with the patches applied (the vendored
      # lru-cache is generated from the patched install).
      - name: Vendored lru-cache modules are current
        run: node scripts/perry/gen/lru-cache-modules.mjs --check

  # The Phase 3/4 dark tests: each compiles a real subsystem and diffs its
  # behaviour against Node (reporter is compiled-only). These fit in ~3GB;
  # the full-binary build does NOT and stays out until an 8GB runner class
  # is sorted (notes F46).
  dark-tests:
    name: Dark tests (compiled vs Node)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read Perry Pin
        id: pin
        run: echo "version=$(jq -r .version perry-toolchain.json)" >> "$GITHUB_OUTPUT"

      - name: Cache Perry Toolchain
        uses: actions/cache@v4
        with:
          path: ~/.cache/vltpkg-perry
          key: perry-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.version }}

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Install Perry
        run: ./scripts/perry/setup-toolchain.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '^22.22.0'
          check-latest: true

      - name: Setup vlt
        uses: vltpkg/setup-vlt@v1

      - name: Install Dependencies
        run: vlt install

      - name: Apply patches
        run: ./scripts/perry/apply-patches.sh

      - name: Cache dark test
        run: ./scripts/perry/dark/cache/run.sh

      - name: Transport dark test
        run: ./scripts/perry/dark/transport/run.sh

      - name: Prompt dark test
        run: ./scripts/perry/dark/prompt/run.sh

      - name: Reporter dark test
        run: ./scripts/perry/dark/reporter/run.sh

      - name: Daemons dark test
        run: ./scripts/perry/dark/daemons/run.sh
