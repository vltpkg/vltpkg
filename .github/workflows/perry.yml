name: Perry

# Phase 0 of the vlt → Perry native-binary port (perry-port-plan.md).
# Scope today: prove the pinned toolchain compiles + runs a hello-world in CI.
# Phases 2/6 grow this into the per-PR `perry check` gate and the smoke job.

on:
  push:
    branches:
      - main
    paths:
      - 'perry.toml'
      - 'perry-toolchain.json'
      - 'perry-patches/**'
      - 'scripts/perry/**'
      - '.github/workflows/perry.yml'
  pull_request:
    paths:
      - 'perry.toml'
      - 'perry-toolchain.json'
      - 'perry-patches/**'
      - 'scripts/perry/**'
      - '.github/workflows/perry.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate-g0:
    name: Gate G0 (compile hello-world)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read Perry Pin
        id: pin
        run: echo "version=$(jq -r .version perry-toolchain.json)" >> "$GITHUB_OUTPUT"

      # Extracted toolchain is ~1.7GB (525MB download). Cache hit skips both.
      # Revisit if save/restore costs more than the download (G6 measures CI wall-time).
      - name: Cache Perry Toolchain
        uses: actions/cache@v4
        with:
          path: ~/.cache/vltpkg-perry
          key: perry-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.version }}

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Install Perry
        run: ./scripts/perry/setup-toolchain.sh

      # Diagnostics only — gate-g0.sh is the assertion.
      - name: Perry Doctor
        continue-on-error: true
        run: |
          PERRY_DIR="$(./scripts/perry/setup-toolchain.sh)"
          "$PERRY_DIR/perry" doctor

      - name: Gate G0
        run: ./scripts/perry/gate-g0.sh
