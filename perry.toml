# Perry project config for the vlt native-binary port.
# The toolchain pin lives in perry-toolchain.json, not here.
#
# `perry compile` alone will not link this entry — the pin's driver cannot
# link anything that reaches the full stdlib. Build with
# ./scripts/perry/build.sh, which owns that link step.

[project]
name = "vlt"
entry = "scripts/perry/entry.ts"

[build]
out_dir = ".build-perry"
opt_level = 2
