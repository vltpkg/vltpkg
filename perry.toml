# Perry project config for the vlt native-binary port.
# The toolchain pin is the @perryts/perry version in package.json.
#
# Build with ./scripts/perry/build.sh (`vlxl -- perry compile` plus bin symlinks).

[project]
name = "vlt"
entry = "scripts/perry/entry.ts"

[build]
out_dir = ".build-perry"
opt_level = 2
